global:
  scrape_interval: 5s

scrape_configs:
  - job_name: learner
    static_configs:
      - targets: ["host.docker.internal:8000"]

  # One target per actor, at 8100 plus its --env-id. Add a line for each actor beyond the fourth.
  - job_name: actors
    static_configs:
      - targets:
          - host.docker.internal:8100
          - host.docker.internal:8101
          - host.docker.internal:8102
          - host.docker.internal:8103
