// The contract between actors and the learner.
//
// Actors play the game and send experience to the learner, which trains on it.
// The learner publishes each new version of the weights to the coordinator,
// and actors fetch them from there. Python code is generated from this file at image build time
// (see docker/game/Dockerfile), and the Go coordinator's code too
// (docker/coordinator/Dockerfile).
syntax = "proto3";

package sts.v1;

// Where the generated Go code lives (coordinator/gen/stsv1, made at build time).
option go_package = "sts/coordinator/gen/stsv1;stsv1";

// Served by the Go coordinator: what actors call.
service Actors {
  // The current policy. An actor calls this at startup, and after every
  // rollout with min_version set to wait for the next one (a long poll).
  rpc GetWeights(GetWeightsRequest) returns (Weights);
}

// Served by the Go coordinator: what the learner calls.
service Trainer {
  // Make these the weights actors get. The newest publish wins; publishing the
  // same version and run_id again is a no-op, so the learner can repeat it.
  rpc PublishWeights(Weights) returns (PublishAck);

  // Which weights the coordinator holds: their version and run_id, without the
  // weights themselves. The coordinator keeps the weights only in memory, so
  // after it restarts it has none. The learner calls this every few seconds
  // and publishes again if the answer isn't what it last published.
  rpc CurrentVersion(CurrentVersionRequest) returns (WeightsVersion);
}

message PublishAck {
  bool replaced = 1;  // false if the coordinator already had exactly this version
}

message CurrentVersionRequest {}

message WeightsVersion {
  int64 version = 1;
  string run_id = 2;  // empty if nothing has been published since the coordinator started
}

// Served by the Python learner.
service Learner {
  // One finished rollout: n_steps of experience made with policy_version.
  rpc SubmitRollout(Rollout) returns (SubmitAck);
}

// One numpy array: raw bytes in C order, plus what's needed to rebuild it.
message Tensor {
  repeated int64 shape = 1;
  string dtype = 2;  // numpy dtype name, e.g. "float32", "bool"
  bytes data = 3;
}

message GetWeightsRequest {
  string actor_id = 1;
  // Wait (up to ~30 s) until the coordinator has at least this version. If it still
  // doesn't, the reply has only the current version and no weights: ask again.
  // 0 means don't wait.
  int64 min_version = 2;
  // The run_id of the learner this actor last got weights from, empty at first.
  // If the learner has restarted since, min_version is ignored and the reply
  // comes at once with the current weights: the version being waited for may never come.
  string run_id = 3;
}

message Weights {
  int64 version = 1;
  bytes state_dict = 2;   // torch.save() of the policy's state_dict
  PolicyConfig config = 3; // how to build the network these weights fit, and the PPO settings
  string run_id = 4;      // new every time the learner process starts
}

// Mirrors model/policy.py TrainingConfig. The learner owns it; actors build from it.
message PolicyConfig {
  int32 n_steps = 1;
  double gamma = 2;
  double gae_lambda = 3;
  double learning_rate = 4;
  double ent_coef = 5;
  double clip_range = 6;
  int32 n_epochs = 7;
  int32 batch_size = 8;
  repeated int32 policy_layers = 9;
  repeated int32 value_layers = 10;
  double reward_scale = 11;
}

// Every Tensor has n_steps as its first dimension.
message Rollout {
  string actor_id = 1;
  int64 policy_version = 2;  // the Weights.version the actor played with
  int32 n_steps = 3;

  map<string, Tensor> observations = 4;  // one entry per observation key (deck, hand, map, ...)
  Tensor action_masks = 5;               // legal actions at each step (bool), what log_probs were computed over
  Tensor actions = 6;
  Tensor log_probs = 7;                  // log P_old(action) under policy_version
  Tensor values = 8;
  Tensor rewards = 9;
  Tensor dones = 10;
  Tensor advantages = 11;
  Tensor returns = 12;
}

message SubmitAck {
  bool accepted = 1;
  string reason = 2;  // why it was rejected, if it was
  string run_id = 3;  // the learner process that now holds the rollout (or refused it)
}
